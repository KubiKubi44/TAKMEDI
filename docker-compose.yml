services:
  db:
    image: postgres:16-alpine
    container_name: medpredani-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medpredani
    ports:
      - "5433:5432"
    volumes:
      - medpredani-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lokální náhrada S3 pro vývoj. V produkci se použije úložiště v EU.
  storage:
    image: minio/minio:latest
    container_name: medpredani-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medpredani
      MINIO_ROOT_PASSWORD: medpredani-dev-heslo
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - medpredani-storage:/data

volumes:
  medpredani-db:
  medpredani-storage:
